apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-static-site-app
  namespace: default
spec:
  rules:
    - host: <PRID>.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-static-site-app
                port:
                  number: 80
  ingressClassName: nginx